<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TAQNIAH</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      overflow: hidden;
      font-family: "Tahoma", Arial, sans-serif;
      color: #fff;
    }

    .container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* الخلفية */
    .circle {
      position: absolute;
      border-radius: 50%;
      opacity: 0.9;
      filter: blur(18px);
    }

    .g1 {
      background: radial-gradient(circle at 30% 30%, #344b4b 0%, #1d0c22 60%, #2e0a5b 100%);
    }

    .g2 {
      background: radial-gradient(circle at 70% 30%, #344b4b 0%, #1d0c22 60%, #2e0a5b 100%);
    }

    .g3 {
      background: radial-gradient(circle at 30% 70%, #344b4b 0%, #1d0c22 60%, #2e0a5b 100%);
    }

    .g4 {
      background: radial-gradient(circle at 70% 70%, #344b4b 0%, #1d0c22 60%, #2e0a5b 100%);
    }

    .g5 {
      background: radial-gradient(circle at 50% 20%, #344b4b 0%, #1d0c22 60%, #2e0a5b 100%);
    }

    .c1 { width: 100px; height: 100px; top: 8%; left: 10%; animation: m1 10s infinite ease-in-out; }
    .c2 { width: 160px; height: 160px; top: 5%; left: 40%; animation: m2 14s infinite ease-in-out; }
    .c3 { width: 120px; height: 120px; top: 8%; right: 10%; animation: m3 12s infinite ease-in-out; }
    .c4 { width: 90px; height: 90px; top: 45%; left: 20%; animation: m4 16s infinite ease-in-out; }
    .c5 { width: 70px; height: 70px; top: 50%; left: 50%; animation: m5 11s infinite ease-in-out; }
    .c6 { width: 110px; height: 110px; top: 40%; right: 20%; animation: m1 13s infinite ease-in-out; }
    .c7 { width: 130px; height: 130px; bottom: 10%; left: 8%; animation: m2 15s infinite ease-in-out; }
    .c8 { width: 100px; height: 100px; bottom: 5%; left: 40%; animation: m3 12s infinite ease-in-out; }
    .c9 { width: 90px; height: 90px; bottom: 10%; right: 10%; animation: m4 14s infinite ease-in-out; }

    @keyframes m1 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(40px, -30px); }
    }

    @keyframes m2 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-60px, 40px); }
    }

    @keyframes m3 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(30px, 60px); }
    }

    @keyframes m4 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-40px, -50px); }
    }

    @keyframes m5 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(20px, -20px); }
    }

    .page {
      position: relative;
      z-index: 5;
      width: 100%;
      height: 100%;
    }

    /* الهيدر */
    .topbar {
      width: 100%;
      background: rgba(50, 50, 50, 0.65);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding: 10px 28px;
    }

    .topbar-inner {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 500;
      color: #b9d8d5;
      letter-spacing: 1px;
      font-family: Georgia, "Times New Roman", serif;
    }

    .brand img {
      width: 60px;
      height: 60px;
      object-fit: contain;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav a,
    .nav .active {
      text-decoration: none;
      color: #dcebea;
      border: 1px solid rgba(158, 197, 195, 0.65);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
      background: rgba(255, 255, 255, 0.03);
      transition: 0.2s;
    }

    .nav .active {
      background: #9ec5c3;
      color: #18302d;
      font-weight: 700;
    }
    /* محتوى الصفحات الثانية */
    .page-content {
      position: relative;
      z-index: 5;
      width: 100%;
      height: calc(100vh - 81px);
      padding: 20px;
      overflow: auto;
    }

    @media (max-width: 900px) {
      .topbar-inner {
        flex-direction: column;
        align-items: flex-start;
      }

      .brand h1 {
        font-size: 24px;
      }

      .page-content {
        height: calc(100vh - 125px);
      }
    }
  </style>
  </head>
<body>
  <div class="container">
    <!-- الخلفية -->
    <div class="circle c1 g1"></div>
    <div class="circle c2 g2"></div>
    <div class="circle c3 g3"></div>
    <div class="circle c4 g4"></div>
    <div class="circle c5 g5"></div>
    <div class="circle c6 g1"></div>
    <div class="circle c7 g2"></div>
    <div class="circle c8 g3"></div>
    <div class="circle c9 g4"></div>

    <div class="page">
      <!-- الهيدر -->
      <header class="topbar">
        <div class="topbar-inner">
          <nav class="nav">
            <a class="active" href="#">أكاديمي</a>
            <a href="#">الرئيسية</a>
            <a href="#">مشروعي</a>
            <a href="#">المشاريع</a>
            <a href="#">عن المنصة</a>
          </nav>

          <div class="brand">
            <h1>TAQNIAH</h1>
            <img src="لوقو-الكلية 1.png" alt="لوقو">
          </div>
        </div>
      </header>

      <!-- حطي هنا محتوى أي صفحة -->
      <main class="page-content">
        
      </main>
    </div>
  </div>
</body>
</html>
